# Все published-порты биндятся на 127.0.0.1: бэкенд без аутентификации и
# Streamlit с выключенным XSRF не должны быть доступны из LAN (ADR-0002 ставит
# весь дизайн «без auth / без валидации путей» в зависимость от этого). Внутри
# compose-сети сервисы всё равно видят друг друга по имени (frontend ->
# http://backend:8756).
services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - CONSENSUS_BACKEND_URL=http://backend:8756

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8756:8756"
    volumes:
      - ./data:/data
      - paddleocr-models:/root/.paddlex
      - surya-models:/root/.cache/datalab
    environment:
      - PYTHONUNBUFFERED=1
      # Code-level граница путей: input_dir/output_dir в /run обязаны быть
      # внутри /data (см. backend/main.py::_reject_outside_data_root).
      - OCR_DATA_ROOT=/data
      # VLM-режим (см. backend/pipeline_vlm.py): все модели обслуживает один
      # llama.cpp llama-server (сервис llama-vlm ниже, профили vlm-cpu/vlm-gpu).
      - VLM_ENDPOINT=${VLM_ENDPOINT:-http://llama-vlm:8080}

  # ── VLM-модели: один движок — llama.cpp (по умолчанию НЕ поднимается) ─────
  # CPU:  docker compose --profile vlm-cpu up -d
  # GPU:  docker compose --profile vlm-gpu up -d   (нужен nvidia-container-toolkit)
  # Профили взаимоисключающие (один порт/имя llama-vlm) — поднимайте один.
  # Скрипты-обёртки: scripts/vlm/setup.sh / scripts/vlm/setup.ps1
  #
  # llama-server работает в router-режиме: все 5 моделей описаны пресетами в
  # scripts/vlm/models.ini, модель выбирается полем "model" запроса и грузится
  # по требованию. --models-max 1 (VLM_MODELS_MAX): в памяти одна модель —
  # следующая вытесняет предыдущую (backend обходит папку «модель за моделью»,
  # так что смен столько, сколько выбрано моделей).
  #
  # Supply chain: образ llama.cpp запинен по номеру сборки, GGUF — по коммиту
  # HF-репозитория (scripts/vlm/fetch_models.py). llama.cpp не исполняет код из
  # репозиториев моделей (в отличие от vLLM --trust-remote-code).

  vlm-models:
    # Однократный init: скачивает GGUF в volume vlm-models и патчит mmproj
    # PaddleOCR-VL (image_max_pixels для Spotting). Повторный запуск пропускает
    # уже скачанное. VLM_MODELS — подмножество моделей через запятую (экономия диска).
    image: python:3.12-slim
    profiles: ["vlm-cpu", "vlm-gpu"]
    volumes:
      - vlm-models:/models
      - ./scripts/vlm/fetch_models.py:/fetch_models.py:ro
    environment:
      - VLM_MODELS=${VLM_MODELS:-}
      - HF_HUB_DISABLE_TELEMETRY=1
    command: >
      sh -c "pip install --no-cache-dir --quiet --disable-pip-version-check --root-user-action=ignore
      huggingface_hub==2.0.0 gguf==0.19.0 && python /fetch_models.py /models"
    restart: "no"

  llama-vlm:
    image: ghcr.io/ggml-org/llama.cpp:server-b11206
    profiles: ["vlm-cpu"]
    depends_on:
      vlm-models:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - vlm-models:/models:ro
      - ./scripts/vlm/models.ini:/models.ini:ro
    command: >
      --models-preset /models.ini --models-max ${VLM_MODELS_MAX:-1}
      --host 0.0.0.0 --port 8080

  llama-vlm-gpu:
    # Та же конфигурация на CUDA-сборке llama.cpp; для backend'а — то же имя
    # llama-vlm (сетевой alias), так что VLM_ENDPOINT менять не нужно.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11206
    profiles: ["vlm-gpu"]
    depends_on:
      vlm-models:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - vlm-models:/models:ro
      - ./scripts/vlm/models.ini:/models.ini:ro
    networks:
      default:
        aliases: [llama-vlm]
    command: >
      --models-preset /models.ini --models-max ${VLM_MODELS_MAX:-1}
      --n-gpu-layers 999 --host 0.0.0.0 --port 8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLM_GPU:-0}"]
              capabilities: [gpu]

volumes:
  paddleocr-models:
  surya-models:
  vlm-models:
