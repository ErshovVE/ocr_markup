services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data
    environment:
      - PYTHONUNBUFFERED=1

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8756:8756"
    volumes:
      - ./data:/data
      - paddleocr-models:/root/.paddlex
      - surya-models:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  paddleocr-models:
  surya-models:
