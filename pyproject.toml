[tool.ruff]
target-version = "py311"
line-length = 100
src = ["frontend", "backend"]
exclude = ["legacy", ".venv*", "predict.py", "predict.ipynb"]

[tool.ruff.lint]
# Намеренно НЕ включаем правила pyupgrade (UP) — проект сознательно сохраняет
# Dict/List/Optional из typing вместо dict/list/X | None (см. CLAUDE.md).
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["frontend/tests", "backend/tests"]
