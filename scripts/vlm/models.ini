; Пресеты моделей VLM-режима для llama-server в router-режиме
; (docker-compose.yml: llama-vlm / llama-vlm-gpu, флаг --models-preset).
;
; Имя секции = поле "model" в запросе backend'а
; (backend/config.py::VLM_ENGINE_META[...]["served_model_name"]).
; Файлы кладёт init-контейнер vlm-models (scripts/vlm/fetch_models.py) в /models.
; Пути абсолютные: образ llama.cpp ищет свои библиотеки относительно рабочей
; директории /app, поэтому её менять нельзя. Нативный запуск (scripts/vlm/setup.*)
; генерирует копию этого файла с путём к локальной папке моделей вместо /models.
version = 1

[*]
; картинка страницы + ответ до VLM_MAX_OUTPUT_TOKENS=8192 (backend/config.py)
c = 16384
temp = 0

; PaddleOCR-VL 1.6 — "Spotting:" (строки + боксы). mmproj пропатчен:
; clip.vision.image_max_pixels = 1605632 (требование Spotting из README GGUF).
[paddleocr-vl]
model = /models/paddleocr-vl/PaddleOCR-VL-1.6-GGUF.gguf
mmproj = /models/paddleocr-vl/PaddleOCR-VL-1.6-GGUF-mmproj.gguf

[hunyuan-ocr]
model = /models/hunyuan-ocr/HunyuanOCR-Q8_0.gguf
mmproj = /models/hunyuan-ocr/mmproj-HunyuanOCR-Q8_0.gguf

[glm-ocr]
model = /models/glm-ocr/GLM-OCR-Q8_0.gguf
mmproj = /models/glm-ocr/mmproj-GLM-OCR-Q8_0.gguf

[dots-ocr]
model = /models/dots-ocr/dots.ocr-Q8_0.gguf
mmproj = /models/dots-ocr/mmproj-dots.ocr-Q8_0.gguf

; GGUF от сообщества (официального нет); архитектура DeepSeek-OCR —
; поддержка в llama.cpp с ggml-org/llama.cpp#17400.
[unlimited-ocr]
model = /models/unlimited-ocr/Unlimited-OCR-Q8_0.gguf
mmproj = /models/unlimited-ocr/mmproj-Unlimited-OCR-F16.gguf
